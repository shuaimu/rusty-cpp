[package]
name = "rusty-cpp-transpiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Shuai Mu <shuai@cs.stonybrook.edu>"]
description = "Transpile Rust source code to C++ using rusty-cpp types"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rusty-cpp-transpiler"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# flock(2) for the shared module-cache build lock (already in the tree
# transitively; pinning it directly for the one syscall).
libc = "0.2"
# --verus-exec: Verus's own EraseAll erasure (vendored in ../verus-erase) and a
# deterministic printer for the erased source handed to every later pass.
verus-erase = { path = "../verus-erase" }
prettyplease = "0.2"

[dev-dependencies]
tempfile = "3"
